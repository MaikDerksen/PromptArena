
env:
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY # The env var name your app uses
    secret: stripe-live-publishable-key     # The ID of the secret in Secret Manager
  - variable: STRIPE_SECRET_KEY                   # The env var name your app uses
    secret: stripe-live-secret-key         # The ID of the secret in Secret Manager
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-live-webhook-secret     # The ID of the secret in Secret Manager
  - variable: GOOGLE_API_KEY
    secret: google-ai-api-key              # The ID of the secret in Secret Manager
