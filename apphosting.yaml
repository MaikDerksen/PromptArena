# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables accessible to your application at runtime.
# These are NOT for secrets.
environmentVariables:
  # Replace with your actual production domain
  NEXT_PUBLIC_APP_URL: "https://your-production-domain.com" # Example: https://promptarena.web.app or your custom domain

# Secret environment variables fetched from Google Cloud Secret Manager.
# You need to create these secrets in Secret Manager first and grant
# the App Hosting service agent the "Secret Manager Secret Accessor" role.
secretEnvironmentVariables:
  - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY # The env var name your app uses
    secret: stripe-live-publishable-key    # The ID of the secret in Secret Manager
    # Optional: specify version, defaults to 'latest'
    # version: "1"
  - key: STRIPE_SECRET_KEY                  # The env var name your app uses
    secret: stripe-live-secret-key        # The ID of the secret in Secret Manager
  - key: STRIPE_WEBHOOK_SECRET
    secret: stripe-live-webhook-secret    # The ID of the secret in Secret Manager
  - key: GOOGLE_API_KEY
    secret: google-ai-api-key             # The ID of the secret in Secret Manager
